# Publishes a GitHub release when a version tag (vMAJOR.MINOR.PATCH) is
# pushed, with a source archive and its SHA-256 attached. Consumers pin the
# attached archive: an uploaded asset is byte-stable, while GitHub's
# automatic source archives are not guaranteed to be. See VERSIONING.md.
#
# No MLX build happens here: the release packages source, and the test
# suite (which needs a Metal GPU) runs before a tag is cut.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag and project(VERSION) must agree, or the archive's version
      # header would name a different release than its tag.
      - name: Check the tag matches the project version
        run: |
          project_version=$(sed -n 's/^project(mlx_performance_profiler VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v${project_version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match project version ${project_version}"; exit 1; }

      - name: Create the source archive and its digest
        run: |
          archive_name="mlx-performance-profiler-${GITHUB_REF_NAME#v}.tar.gz"
          git archive --format=tar.gz --prefix="mlx-performance-profiler-${GITHUB_REF_NAME#v}/" \
            -o "${archive_name}" "${GITHUB_REF_NAME}"
          sha256sum "${archive_name}" > "${archive_name}.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mlx-performance-profiler-*.tar.gz
            mlx-performance-profiler-*.tar.gz.sha256
          body: |
            Release notes and the MLX releases this version was tested
            against: see CHANGELOG.md at this tag. Pin the attached archive
            by the SHA-256 in the .sha256 file.
